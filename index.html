<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="모쪼비" />
<meta name="theme-color" content="#FFF7FB" />
<title>모쪼비 – 육아 시간표, 할일 체크, 투두</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#5A4E68; --muted:#A99DBB; --faint:#C3B9D1;
    --line:#F0E8F8; --card:#FFFFFF;
    --cute:'Gaegu','Apple SD Gothic Neo',sans-serif;
    --round:'Jua','Gaegu','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--cute); font-size:17px; color:var(--ink);
    background:linear-gradient(180deg,#FFF7FB 0%,#F6F4FF 100%);
    height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
  }
  button,input,select,textarea{font-family:inherit;color:inherit;}
  button{border:none;background:none;cursor:pointer;}
  header{padding:14px 14px 10px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5;padding-top:calc(14px + env(safe-area-inset-top));}
  .titleRow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  h1{font-family:var(--round);font-size:21px;margin:0;color:#7A6A8C;}
  .brand{display:flex;align-items:center;gap:7px;}
  .logo{width:28px;height:28px;flex-shrink:0;}
  .tag{font-size:13px;padding:5px 10px;border-radius:999px;margin-left:auto;background:#DDEFC0;color:#4C6B33;}
  .tag.warn{background:#E4E0EA;color:#6E6180;}
  .ghost{background:#F3EDFA;color:#9C8CB4;border-radius:999px;padding:6px 13px;font-size:15px;}
  .chips{display:flex;gap:6px;margin-top:12px;}
  .chip{flex:1;position:relative;padding:9px 0;border-radius:16px;font-family:var(--round);font-size:17px;border:2px solid var(--line);background:#fff;color:#8FA6C4;transition:all .18s;}
  .chip.wknd{color:#D98BAE;}
  .chip.on{border-color:transparent;transform:translateY(-2px) scale(1.06);color:#4A3B57;background:#C6E4F7;}
  .chip.on.wknd{background:#F7C9D9;}
  .chip .dot{position:absolute;top:5px;right:8px;width:6px;height:6px;border-radius:99px;background:#F58FBB;}
  main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px;}
  .clipbar{margin:10px 14px 0;padding:10px 12px;border-radius:16px;background:#FFF4DE;border:2px solid #F3DFB4;}
  .clipbar .c1{font-family:var(--round);font-size:16px;color:#8A6A2A;}
  .clipbar .c3{font-size:13px;color:#B39A63;margin-top:2px;}
  .clipbar .c2{display:flex;gap:6px;margin-top:8px;}
  .clipbar .soft{background:rgba(255,255,255,.75);color:#8A7346;}
  #toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);background:rgba(74,59,87,.92);color:#fff;
    font-size:15px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .2s;z-index:40;max-width:86%;text-align:center;}
  #toast.on{opacity:1;transform:translate(-50%,0);}
  .card{margin:12px 14px;padding:12px 14px;background:var(--card);border-radius:20px;box-shadow:0 4px 14px rgba(160,140,190,.10);}
  .cardLabel{font-family:var(--round);font-size:16px;color:#7A6A8C;}
  .barBg{height:10px;background:#F1ECF8;border-radius:99px;margin-top:8px;overflow:hidden;}
  .barFill{height:100%;border-radius:99px;background:linear-gradient(90deg,#F7C9D9,#CBD8F7,#C3EBD5);transition:width .3s;}
  .soft{flex:1;padding:11px 0;border-radius:14px;background:#F6F1FC;color:#9C8CB4;font-size:15px;}
  .rowBtns .soft{flex:1;font-size:14px;padding:11px 2px;}
  .soft.danger{background:#FBE9E9;color:#B57575;}
  .rowBtns{display:flex;gap:8px;margin-top:10px;}
  .startCard{padding-bottom:14px;}
  .startQ{font-family:var(--round);font-size:18px;color:#6E5C82;margin:2px 0 4px;}
  .startSub{font-size:14px;color:#A99CBA;line-height:1.55;margin:0 0 14px;}
  .startOpt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    border:2px solid #EFE7F7;border-radius:16px;padding:12px 14px;margin-top:8px;background:#fff;}
  .soIcon{font-size:18px;color:#B0A1C6;width:22px;text-align:center;flex-shrink:0;}
  .soTxt{display:flex;flex-direction:column;gap:2px;}
  .soTxt b{font-family:var(--round);font-size:16px;color:#6E5C82;font-weight:400;}
  .soTxt i{font-style:normal;font-size:13px;color:#ABA0BA;}
  .list{padding:0 14px;}
  .gap{width:100%;display:flex;align-items:center;gap:8px;padding:7px 0;margin-bottom:8px;}
  .gap .t{width:54px;text-align:right;font-size:13px;color:var(--faint);flex-shrink:0;}
  .gap .x{flex:1;text-align:left;font-size:14px;color:#CDC3DA;border-top:2px dashed #EDE4F5;padding-top:6px;}
  .gapline{width:100%;display:flex;align-items:center;gap:8px;height:30px;}
  .gt{width:54px;text-align:right;font-size:12px;color:#D3CADD;flex-shrink:0;}
  .gt.b{font-size:13px;color:#B2A6C2;}
  .gl{flex:1;border-top:1.5px dashed #EFE7F7;}
  .gapline.hour .gl{border-top:1.5px solid #E7DCF2;}
  .gp{font-size:13px;color:#E2D8ED;width:16px;text-align:center;}
  .blk{display:flex;gap:8px;margin-bottom:8px;}
  .rail{width:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;padding-top:10px;}
  .rail .tm{font-family:var(--round);font-size:15px;color:#9F94AF;}
  .rail .du{font-size:12px;color:var(--faint);}
  .rail .now{margin-top:2px;background:#F58FBB;color:#fff;font-size:11px;padding:1px 7px;border-radius:99px;font-family:var(--round);}
  .box{flex:1;min-width:0;border-radius:18px;border:2px solid;padding:8px 10px 10px;box-shadow:0 3px 8px rgba(150,130,180,.08);}
  .box.done{background:#F7F4FA !important;border-color:#E6E0EE !important;opacity:.78;}
  .top{display:flex;align-items:center;gap:6px;}
  .ck{width:24px;height:24px;border-radius:99px;border:2px solid #fff;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);flex-shrink:0;}
  .ttl{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 0;}
  .ttl .name{font-family:var(--round);font-size:18px;line-height:1.25;word-break:keep-all;}
  .ttl .catname{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.7);}
  .ttl .cnt{font-size:13px;opacity:.7;margin-left:auto;}
  .items{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .it{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:12px;background:rgba(255,255,255,.88);max-width:100%;}
  .it.on{background:rgba(255,255,255,.45);}
  .it .c{width:17px;height:17px;border-radius:99px;border:2px solid #D9D2E4;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;}
  .it .x{font-size:16px;line-height:1.2;word-break:keep-all;color:#584D6B;}
  .it.on .x{color:#ABA3B8;text-decoration:line-through;}
  .strike{text-decoration:line-through;color:#9A93A6 !important;}
  .box.selMode{position:relative;padding-right:40px;}
  .box.picked{border-color:#4A3B57 !important;}
  .sck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:7px;border:2px solid #fff;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);z-index:2;}
  .sck.on{background:#4A3B57;border-color:#4A3B57;}
  .miniBlk.selMode{position:relative;padding-right:28px;}
  .miniBlk.picked{border-color:#4A3B57 !important;border-width:3px;}
  .clusterRow{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;}
  .miniBlk{flex:1;min-width:84px;text-align:left;border-radius:14px;border:2px solid;padding:8px 9px;display:flex;flex-direction:column;gap:3px;box-shadow:0 3px 8px rgba(150,130,180,.08);}
  .miniBlk.done{background:#F7F4FA !important;border-color:#E6E0EE !important;opacity:.78;}
  .miniTm{font-size:11px;opacity:.8;}
  .miniName{font-family:var(--round);font-size:14px;line-height:1.25;word-break:keep-all;}
  .miniCnt{font-size:11px;opacity:.7;}
  /* 주간 */
  .wk{padding:8px 10px 4px;touch-action:pan-x pan-y;}
  .wkTop{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px;}
  .segRow{display:inline-flex;background:#F3EDFA;border-radius:999px;padding:3px;gap:2px;}
  .seg{padding:6px 13px;border-radius:999px;font-size:14px;color:#9C8CB4;}
  .seg.on{background:#fff;color:#7A5F97;box-shadow:0 1px 3px rgba(150,130,180,.18);}
  .wkScroll{overflow-x:auto;}
  .wkHead{display:flex;gap:4px;position:sticky;top:0;z-index:2;background:#FFF9FC;}
  .wkLabel{padding:7px 0;text-align:center;font-family:var(--round);font-size:15px;color:#BCB2C9;}
  .wkLabel.wknd{color:#D3AFC2;}
  .wkLabel.on{color:#7B3F5C;font-weight:600;}
  .wkBody{display:flex;gap:4px;margin-top:4px;}
  .wkGut{width:36px;position:relative;flex-shrink:0;}
  .wkGut span{position:absolute;right:3px;font-size:11px;color:#B9AEC9;}
  .wkCol{position:relative;border-radius:10px;overflow:hidden;background:#fff;}
  .band{position:absolute;left:0;right:0;}
  .wkB{position:absolute;left:1px;right:1px;border-radius:6px 9px 9px 6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:3px 4px 2px 5px;overflow:hidden;text-align:left;box-shadow:0 1px 3px rgba(140,120,170,.12);}
  .wkB .n{font-family:var(--round);line-height:1.15;word-break:break-all;overflow-wrap:anywhere;width:100%;overflow:hidden;}
  .wkB .s{opacity:.65;line-height:1.2;margin-top:1px;}
  .wkBody.zooming .wkB .n,.wkBody.zooming .wkB .s{transform:scaleY(var(--inv,1));transform-origin:left top;}
  .hint{text-align:center;font-size:14px;line-height:1.6;color:var(--faint);margin:10px 0 4px;}
  .legend{display:flex;flex-wrap:wrap;gap:5px;padding:8px 14px;justify-content:center;background:rgba(255,255,255,.7);}
  .legend button{font-size:13px;padding:4px 10px;border-radius:99px;}
  .legend .edit{background:#F2EDF8;color:#9C8CB4;}
  nav{display:flex;gap:8px;padding:8px 20px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid #F5EFFA;position:sticky;bottom:0;z-index:6;}
  nav button{flex:1;padding:11px 0;border-radius:16px;font-family:var(--round);font-size:17px;color:#B0A6BD;}
  nav button.on{background:#FBE1EC;color:#B85A87;}
  /* 모달 */
  .dim{position:fixed;inset:0;background:rgba(80,66,95,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
  .sheet{position:relative;width:100%;max-width:460px;background:#FFFDFE;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;}
  .grabZone{padding:12px 0 18px;display:flex;justify-content:center;touch-action:none;}
  .grab{width:42px;height:5px;border-radius:99px;background:#EDE4F5;}
  .sheet h2{font-family:var(--round);font-size:20px;color:#7A6A8C;margin:0 0 6px;padding-right:44px;}
  .xbtn{position:absolute;top:8px;right:14px;width:34px;height:34px;border-radius:99px;background:#F3EDFA;color:#A091B5;font-size:15px;line-height:1;}
  .desc{font-size:15px;color:#B0A6BD;margin:0 0 12px;line-height:1.45;}
  label.f{display:block;font-size:15px;color:var(--muted);margin:14px 0 6px;}
  .in{width:100%;padding:11px 13px;border-radius:14px;border:2px solid var(--line);background:#FDFAFF;font-size:17px;outline:none;}
  textarea.in{line-height:1.5;resize:vertical;}
  .wrap{display:flex;flex-wrap:wrap;gap:6px;}
  .catChip{padding:8px 12px;border-radius:14px;font-size:15px;border:2px solid transparent;}
  .catChip.sel{transform:scale(1.04);}
  .step{display:flex;align-items:center;justify-content:space-between;gap:6px;border:2px solid var(--line);border-radius:14px;background:#FDFAFF;padding:4px 6px;}
  .step button{flex:0 0 auto;min-width:62px;height:36px;padding:0 8px;border-radius:10px;background:#F4EDFB;color:#9A87B5;font-size:14px;white-space:nowrap;}
  .step .val{flex:1;text-align:center;font-size:15px;color:#6E6180;white-space:nowrap;}
  .btnRow{display:flex;gap:8px;margin-top:18px;align-items:stretch;}
  .btnRow .secondary{flex:0 0 76px;padding:14px 0;text-align:center;white-space:nowrap;}
  .primary,.secondary{
    padding:14px 0;border-radius:16px;font-family:var(--round);font-size:17px;line-height:1.2;
  }
  .primary{flex:1;background:#F7C9D9;color:#7B3F5C;}
  .secondary{background:#F3EDFA;color:#A091B5;}
  .secondary.danger{background:#FBE9E9;color:#B57575;}
  .catRow{border:2px solid;border-radius:16px;padding:10px;margin-bottom:8px;}
  .swatch{width:34px;height:34px;border-radius:12px;border:2px solid;flesh-shrink:0;}
  .rowDel{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.7);color:#B0A6BD;font-size:14px;flex-shrink:0;}
  .pal{display:none;flex-wrap:wrap;gap:7px;margin-top:10px;padding:8px;background:rgba(255,255,255,.75);border-radius:12px;}
  .pal.open{display:flex;}
  .pal button{width:32px;height:32px;border-radius:10px;border:2px solid rgba(0,0,0,.06);}
  .limit{font-size:13px;color:#B0A6BD;margin:6px 0 0;}
  .prev{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .prev .h{width:100%;font-size:14px;color:var(--muted);}
  .prev span.p{font-size:13px;padding:4px 9px;border-radius:99px;}
</style>
</head>
<body>
<header>
  <div class="titleRow">
    <h1 class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="6" y="6" width="52" height="52" rx="15" fill="none" stroke="#9B7FD4" stroke-width="4"/>
        <rect x="16" y="19" width="32" height="5" rx="2.5" fill="#B9A3E3"/>
        <rect x="16" y="29" width="24" height="5" rx="2.5" fill="#CDBCEC"/>
        <rect x="16" y="39" width="14" height="5" rx="2.5" fill="#E0D5F5"/>
        <path d="M37 45.5l5 5 10.5-11.5" fill="none" stroke="#F58FBB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>모쪼비</span>
    </h1>
    <button id="saveTag" class="tag">저장됨 ✓</button>
    <button class="ghost" data-act="import">글 붙여넣기</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<div class="legend" id="legend"></div>
<nav>
  <button data-act="view" data-v="day" id="tabDay">일간</button>
  <button data-act="view" data-v="week" id="tabWeek">주간</button>
</nav>
<div id="modal"></div>

/* ─── 도우미 ─────────────────────────────────────── */
function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n){ return String(n).padStart(2,"0"); }
function label(i){ var m=i*UNIT; return pad(Math.floor(m/60)%24)+":"+pad(m%60); }
function durText(len){ var m=len*UNIT,h=Math.floor(m/60),r=m%60;
  return (h?h+"시간 ":"")+(r?r+"분":(h?"":"0분")); }
function todayIdx(){ return (new Date().getDay()+6)%7; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function shade(hex,f){ var n=hex.replace("#","");
  var v=[0,2,4].map(function(i){ return Math.round(parseInt(n.slice(i,i+2),16)*f); });
  return "#"+v.map(function(x){ return Math.min(255,x).toString(16).padStart(2,"0"); }).join(""); }
function lineOf(bg){ return shade(bg,.8); }
function inkOf(bg){ return shade(bg,.4); }
function catOf(id){ for(var i=0;i<S.cats.length;i++) if(S.cats[i].id===id) return S.cats[i];
  return S.cats[S.cats.length-1]||DEFAULT_CATS[0]; }

/* ─── 글 → 계획 ──────────────────────────────────── */
var TIME_RE=/^[\s\-–—•*]*(\d{1,2})\s*[:.]\s*(\d{2})\s*(?:[~\-–—]+\s*(\d{1,2})\s*[:.]\s*(\d{2}))?\s*(.*)$/;
function toMin(h,m,prev){ var a=(h%12)*60+m,b=a+720; if(a>=prev) return a; if(b>=prev) return b; return a; }
/* 숫자 뒤 따옴표(분 표시)인지 판별하고, 곧은 ' 하나로 통일 */
var MIN_RE=/^(.*[0-9])\s*[\u0027\u2018\u2019\u2032]$/;
function isMin(t){ return MIN_RE.test(String(t)); }
function normMin(t){
  var m=String(t).match(MIN_RE);
  return m ? m[1]+"'" : String(t);
}
function splitItems(raw){
  var out=[], buf="", depth=0;
  var s=String(raw);
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if("([{（〔【".indexOf(ch)>=0) depth++;
    else if(")]}）〕】".indexOf(ch)>=0) depth=Math.max(0,depth-1);
    if(depth===0){
      var arrow=s.slice(i).match(/^(—+>|-+>|=+>)/);   /* 괄호 밖 화살표만 구분자 */
      if(arrow){ out.push(buf); buf=""; i+=arrow[1].length-1; continue; }
      if(ch===","||ch==="、"||ch==="·"){ out.push(buf); buf=""; continue; }
    }
    buf+=ch;
  }
  out.push(buf);
  return out.map(function(t){
      t=t.replace(/^[\s'’‘"]+/,"").trim();          /* 앞쪽 따옴표 정리 */
      if(isMin(t)) t=normMin(t);                    /* 분 표기는 ' 로 통일 */
      else t=t.replace(/[\s'’‘"]+$/,"");            /* 그 외 따옴표는 정리 */
      return t.trim();
    })
    .filter(function(t){ return t; });
}
/* 한 조각(제목 또는 세부항목)이 어느 카테고리에 속하는지 — 가장 긴 단어가 이김 */
function catOfPhrase(text){
  var hitCat=null, hitLen=0;
  S.cats.forEach(function(c){
    var words=[c.name].concat(String(c.words||"").split(","))
      .map(function(w){ return w.trim(); }).filter(Boolean);
    words.forEach(function(w){
      if(text.indexOf(w)>=0 && w.length>hitLen){ hitLen=w.length; hitCat=c.id; }
    });
  });
  return hitCat;
}
function matchCat(title,items){
  var tally={};
  function add(id,pt){ if(id) tally[id]=(tally[id]||0)+pt; }
  /* 세부항목이 있으면 세부 다수결이 기준, 제목은 동점을 가르는 한 표 */
  items.forEach(function(t){ add(catOfPhrase(t),1); });
  add(catOfPhrase(title), items.length?1:3);
  var best=null, score=0;
  Object.keys(tally).forEach(function(id){
    if(tally[id]>score){ score=tally[id]; best=id; }
  });
  return best||S.cats[S.cats.length-1].id;
}
function parseText(text){
  var lines=text.split(/\r?\n/), found=[], cur=null, prev=0;
  lines.forEach(function(raw){
    var line=raw.trim(); if(!line) return;
    var m=line.match(TIME_RE);
    if(!m){
      var only=line.replace(/[^월화수목금토일평일주말]/g,"");
      if(line.length<=12 && only.length){ cur=null; return; }
      if(cur) cur.items=cur.items.concat(splitItems(line));
      return;
    }
    var start=toMin(+m[1],+m[2],prev); prev=start;
    var body=m[5];
    var titleMark=body.match(/^([^,、·:：]+)\s*[:：]\s*(.+)$/);   /* "제목: 항목,항목" 형태 */
    var title=null, items;
    if(titleMark){
      title=normMin(titleMark[1].trim());
      items=splitItems(titleMark[2]);
    } else {
      items=splitItems(body);
      if(items.length===1){ title=items.shift(); }   /* 하나뿐이면 그게 제목 */
    }
    cur={ start:Math.floor((start%1440)/UNIT),
          endHint:m[3]?toMin(+m[3],+m[4],start):null,
          title:title, items:items };
    found.push(cur);
  });
  found.sort(function(a,b){ return a.start-b.start; });
  return found.map(function(b,i){
    var next=found[i+1], len;
    if(b.endHint!=null){ var e=b.endHint%1440===0?1440:b.endHint%1440; len=Math.round(e/UNIT)-b.start; }
    else len=next?next.start-b.start:N-b.start;
    if(len<=0) len=next?Math.max(1,next.start-b.start):N-b.start;
    var cat=matchCat(b.title||"", b.items);
    var title=b.title;
    if(!title){   /* 나열식이라 제목이 없으면 카테고리 이름을 제목으로 */
      var cObj=S.cats.filter(function(c){ return c.id===cat; })[0];
      title=cObj?cObj.name:"할 일";
    }
    return { id:uid(), start:b.start, len:Math.min(len,N-b.start), title:title,
      cat:cat,
      items:b.items.map(function(t){ return {id:uid(),t:t,done:false}; }), done:false };
  });
}

function gapHTML(start,len){

       '<span class="gt'+(hour?" b":"")+'">'+label(i)+'</span>'+
       '<span class="gl"></span><span class="gp">＋</span></button>';
    i+=step;
  }
  return h;
}
/* 겹치는 블록끼리 묶기 (시작 시각 순 정렬된 bs 전제) */
function clusterBlocks(bs){
  var out=[], cur=null;
  bs.forEach(function(b){
    if(cur && b.start<cur.end){
      cur.blocks.push(b);
      cur.end=Math.max(cur.end,b.start+b.len);
    } else {
      cur={ start:b.start, end:b.start+b.len, blocks:[b] };
      out.push(cur);
    }
  });
  return out;
}

/* 겹치는 블록끼리 좌우 칸을 나눠 배정 (id -> {col,cols}) */
function assignColumns(blocks){
  var sorted=blocks.slice().sort(function(a,b){ return a.start-b.start; });
  var map={};
  clusterBlocks(sorted).forEach(function(cl){
    var colEnds=[];
    cl.blocks.forEach(function(b){
      var col=-1;
      for(var i=0;i<colEnds.length;i++){ if(colEnds[i]<=b.start){ col=i; break; } }
      if(col===-1){ col=colEnds.length; colEnds.push(0); }
      colEnds[col]=b.start+b.len;
      map[b.id]={col:col};
    });
    var total=colEnds.length;
    cl.blocks.forEach(function(b){ map[b.id].cols=total; });
  });
  return map;
}

function attachZoomPinch(){
  var mainEl=document.getElementById("main");
  if(!mainEl||mainEl._pinchBound) return;
  mainEl._pinchBound=true;
  var body=null, renderedH=0, originPct=50, anchorSlot=0, anchorScreenY=0;
  function distY(t){ return Math.max(1,Math.abs(t[0].clientY-t[1].clientY)); }
  function setInv(s){
    if(!body) return;
    body.style.setProperty("--inv", (1/s));
    body.classList.add("zooming");
  }
  function finish(){
    if(!pinchState.on) return;
    pinchState.on=false;
    if(body){ body.style.transform=""; body.classList.remove("zooming"); body.style.removeProperty("--inv"); }
    var sc=document.querySelector(".wkScroll"), keepLeft=sc?sc.scrollLeft:null;
    renderMain();
    var sc2=document.querySelector(".wkScroll");
    if(sc2&&keepLeft!=null) sc2.scrollLeft=keepLeft;
    /* 손가락 가운데 있던 시각이 화면의 같은 자리에 오도록 스크롤 맞춤 */
    var body2=document.querySelector(".wkBody");
    if(body2){
      var bodyTopInMain=body2.getBoundingClientRect().top-mainEl.getBoundingClientRect().top+mainEl.scrollTop;
      var want=bodyTopInMain+anchorSlot*UI.weekH-anchorScreenY;
      var max=Math.max(0, mainEl.scrollHeight-mainEl.clientHeight);
      mainEl.scrollTop=Math.max(0, Math.min(max, want));
    }
  }
  mainEl.addEventListener("touchstart",function(e){
    if(UI.view!=="week"||e.touches.length!==2) return;
    body=document.querySelector(".wkBody");
    if(!body) return;
    pinchState.on=true;
    pinchState.startDist=distY(e.touches);
    pinchState.startH=UI.weekH;
    renderedH=UI.weekH;
    var rect=body.getBoundingClientRect();
    var midY=(e.touches[0].clientY+e.touches[1].clientY)/2;
    originPct=rect.height?Math.max(0,Math.min(100,(midY-rect.top)/rect.height*100)):50;
    anchorSlot=(midY-rect.top)/renderedH;          /* 손가락 가운데가 가리키던 시각(슬롯) */
    anchorScreenY=midY-mainEl.getBoundingClientRect().top;  /* 그때 화면상의 높이 */
  },{passive:true});
  mainEl.addEventListener("touchmove",function(e){
    if(!pinchState.on||e.touches.length!==2||!body) return;
    var ratio=distY(e.touches)/pinchState.startDist;
    UI.weekH=Math.max(4,Math.min(22, pinchState.startH*ratio));
    var s=UI.weekH/renderedH;
    body.style.transformOrigin="0 "+originPct+"%";
    body.style.transform="scaleY("+s+")";
    setInv(s);
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  mainEl.addEventListener("touchend",function(e){ if(e.touches.length<2) finish(); },{passive:true});
  mainEl.addEventListener("touchcancel",finish,{passive:true});
}
function render(){ renderChips(); renderLegend(); renderMain(); }

/* ── 요일을 넘길 때 '같은 시각'을 화면 위에 유지 ── */
function scrollHost(){
  var m=document.getElementById("main");
  if(m && m.scrollHeight>m.clientHeight+2) return m;      /* 정상: main 이 스크롤 */
  return document.scrollingElement||document.documentElement;  /* 예외: 문서가 스크롤 */
}
function hostBase(host){
  if(host===document.scrollingElement||host===document.documentElement) return 0;
  return host.getBoundingClientRect().top;
}
function hostOffset(host){   /* 문서 스크롤이면 고정 머리말 높이만큼 빼줌 */
  if(host===document.getElementById("main")) return 0;
  var hd=document.querySelector("header");
  return hd?hd.getBoundingClientRect().height:0;
}
function rowsInfo(){
  var m=scrollHost(), base=hostBase(m), st=m.scrollTop;
  var els=document.querySelectorAll("#main [data-t]"), out=[];
  for(var i=0;i<els.length;i++){
    var r=els[i].getBoundingClientRect();
    out.push({ el:els[i],
      kind:els[i].getAttribute("data-kind"),
      t:+els[i].getAttribute("data-t"),
      len:Math.max(1,+els[i].getAttribute("data-len")||1),
      top:r.top-base+st, h:Math.max(1,r.height) });
  }
  return out;
}
/* 화면 맨 위에 있는 줄의 '시작 시각'을 그대로 기준으로 삼는다.
   (줄 안에서 비율로 환산하면 요일마다 블록 경계가 달라 크게 튄다) */
function topTime(){
  var m=scrollHost(), st=m.scrollTop, rows=rowsInfo();
  if(!rows.length) return null;
  for(var i=0;i<rows.length;i++){
    if(st < rows[i].top+rows[i].h-1) return rows[i].t;
  }
  return rows[rows.length-1].t;
}
/* 기준 시각에 '가장 가까운 시작 시각'을 가진 줄을 맨 위로 올린다.
   품고 있는 블록으로 되돌아가 크게 밀리는 일이 없다. */
function scrollToTime(time){
  if(time==null) return;
  var m=scrollHost(), rows=rowsInfo();
  if(!rows.length) return;
  var best=rows[0], gap=Math.abs(rows[0].t-time);
  for(var i=1;i<rows.length;i++){
    var g=Math.abs(rows[i].t-time);
    if(g<gap){ gap=g; best=rows[i]; }
  }
  m.scrollTop=best.top-hostOffset(m);
}
function centerWeekDay(){                 /* 주간 보드에서 고른 요일을 가운데로 */
  var sc=document.querySelector(".wkScroll"); if(!sc) return;
  var btn=sc.querySelectorAll('.wkHead .wkLabel')[UI.day]; if(!btn) return;
  var bw=btn.getBoundingClientRect().width;
  var left=btn.getBoundingClientRect().left-sc.getBoundingClientRect().left+sc.scrollLeft;
  var want=left-(sc.clientWidth-bw)/2;
  var max=sc.scrollWidth-sc.clientWidth;
  sc.scrollLeft=Math.max(0,Math.min(max,want));
}
function goDay(d){
  var host = document.getElementById("main");
  var atTop = UI.view==="day" && host && host.scrollTop<8;   /* 버튼 카드가 보이는 맨 위 상태 */
  var keep = (UI.view==="day" && !atTop) ? topTime() : null;
  UI.day=(d+7)%7;
  SEL.on=false; SEL.ids=[];
  UI.skipEmpty=false;
  render();
  requestAnimationFrame(function(){
    if(UI.view==="day"){
      if(atTop){ var h2=document.getElementById("main"); if(h2) h2.scrollTop=0; }
      else if(keep!=null) scrollToTime(keep);
    }
    else centerWeekDay();
  });
}

/* ─── 모달 ───────────────────────────────────────── */
var M=document.getElementById("modal");
function closeModal(){ M.innerHTML=""; }
function sheet(inner){
  M.innerHTML='<div class="dim" data-act="dim"><div class="sheet" id="sheetBody"><div class="grabZone" id="grabZone"><div class="grab"></div></div>'+
    '<button class="xbtn" data-act="close" aria-label="닫기">✕</button>'+inner+'</div></div>';
  attachGrabDrag();
}
function attachGrabDrag(){
  var zone=document.getElementById("grabZone"), sh=document.getElementById("sheetBody");
  if(!zone||!sh) return;
  var startY=0, dy=0, dragging=false;
  function pt(e){ return e.touches?e.touches[0]:e; }
  function onDown(e){
    startY=pt(e).clientY; dy=0; dragging=true; sh.style.transition="none";
    if(e.pointerId!=null && zone.setPointerCapture){ try{ zone.setPointerCapture(e.pointerId); }catch(err){} }
  }
  function onMove(e){
    if(!dragging) return;
    dy=Math.max(0, pt(e).clientY-startY);
    sh.style.transform="translateY("+dy+"px)";
    if(e.cancelable) e.preventDefault();
  }
  function onUp(){
    if(!dragging) return;
    dragging=false;
    sh.style.transition="transform .18s ease-out";
    if(dy>60){ sh.style.transform="translateY(100%)"; setTimeout(closeModal,160); }
    else { sh.style.transform="translateY(0)"; }
  }
  if(window.PointerEvent){
    zone.addEventListener("pointerdown",onDown);
    zone.addEventListener("pointermove",onMove);
    zone.addEventListener("pointerup",onUp);
    zone.addEventListener("pointercancel",onUp);
  } else {
    zone.addEventListener("touchstart",onDown,{passive:true});
    zone.addEventListener("touchmove",onMove,{passive:false});
    zone.addEventListener("touchend",onUp,{passive:true});
    zone.addEventListener("touchcancel",onUp,{passive:true});
  }
}

/* 블록 편집 */
var draft=null;
/* 이 시각 뒤에 있는 가장 가까운 다른 일정의 시작 (없으면 24:00) */
function nextStartAfter(day,start,selfId){
  var n=N;
  (S.days[day]||[]).forEach(function(b){
    if(b.id===selfId) return;
    if(b.start>=start && b.start<n) n=b.start;
  });
  return n;
}
/* 겹치지 않고 늘릴 수 있는 최대 길이 */
function maxLenFor(){
  return Math.max(1, nextStartAfter(draft.day,draft.start,draft.id)-draft.start);
}
/* 이 시각이 다른 일정 안에 들어가 있는지 */
function coveredBy(day,start,selfId){
  var hit=null;
  (S.days[day]||[]).forEach(function(b){
    if(b.id===selfId) return;
    if(start>=b.start && start<b.start+b.len) hit=b;
  });
  return hit;
}

function syncStart(){
  var hh=+document.getElementById("edH").value, mm=+document.getElementById("edM").value;
  draft.start=(hh*60+mm)/UNIT;
  draft.len=Math.min(draft.len, N-draft.start);
  document.getElementById("edTime").textContent=label(draft.start);
  updateLen();
}
function updateLen(){
  document.getElementById("edLen").textContent=durText(draft.len);
  var endSlot=Math.min(N,draft.start+draft.len);
  document.getElementById("edEnd").textContent=label(endSlot);
  var eh=document.getElementById("edEH"), em=document.getElementById("edEM");
  if(eh&&em){ eh.value=Math.floor(endSlot*UNIT/60); em.value=(endSlot*UNIT)%60; }
}
function setEndFromSelect(){
  var eh=+document.getElementById("edEH").value, em=+document.getElementById("edEM").value;
  var endSlot=(eh*60+em)/UNIT;
  if(endSlot<=draft.start) endSlot=draft.start+1;
  draft.len=Math.min(N-draft.start, endSlot-draft.start);
  updateLen();
}
function saveBlock(){
  var title=normMin(document.getElementById("edTitle").value.trim());
  var raw=document.getElementById("edItems").value;
  var oldMap={}; draft.items.forEach(function(i){ oldMap[i.t]=i; });
  var parts=[];
  raw.split(/\n/).forEach(function(line){ parts=parts.concat(splitItems(line)); });
  var items=parts.map(function(t){ return oldMap[t]||{id:uid(),t:t,done:false}; });
  /* 제목을 비워 두면 고른 색 이름을 제목으로 */
  if(!title){
    var cObj=S.cats.filter(function(c){ return c.id===draft.cat; })[0];
    title=cObj?cObj.name:"";
  }
  var d=draft.day;
  var list=(S.days[d]||[]).filter(function(b){ return b.id!==draft.id; });
  list.push({ id:draft.id||uid(), start:draft.start, len:draft.len, title:title, cat:draft.cat,
    items:items, done:draft.id?(S.days[d].find(function(x){return x.id===draft.id;})||{}).done||false:false });
  S.days[d]=list;
  closeModal(); render(); save();
}

/* 글 붙여넣기 */
function openImport(){
  var h='<h2>적어둔 계획 불러오기</h2><p class="desc">쓰던 글을 그대로 붙여넣으세요. 시간은 <b>-7:30</b>처럼, 세부 항목은 쉼표로 나누면 돼요.<br>제목을 정하고 싶으면 <b>낮잠준비: 자장가,안기</b>처럼 콜론을 쓰세요. 안 쓰면 색 이름으로 자동으로 붙고, 나중에 고칠 수 있어요.</p>';
  h+='<textarea class="in" id="imText" rows="8" placeholder="-7:30 패드치우기,물보충,설거지1&#10;-11:00 낮잠준비: 자장가,안기,눕힘&#10;-9:30 밤잠"></textarea>';
  h+='<div class="prev" id="imPrev"></div>';
  h+='<label class="f">어느 요일에 넣을까요? (덮어써요)</label><div class="wrap" id="imDays">';
  for(var i=0;i<7;i++) h+='<button class="catChip'+(i===UI.day?" selD":"")+'" data-act="imDay" data-d="'+i+'" style="background:'+(i===UI.day?"#C6E4F7":"#F5F1FA")+';color:'+(i===UI.day?"#3C5F8C":"#9A93A6")+'">'+DAYS[i]+'</button>';
  h+='</div><div class="btnRow"><button class="primary" data-act="doImport">계획표에 넣기</button></div>';
  sheet(h);
  document.getElementById("imText").addEventListener("input",updateImPrev);
}
function updateImPrev(){
  var t=document.getElementById("imText").value.trim();
  var p=document.getElementById("imPrev");
  if(!t){ p.innerHTML=""; return; }
  var parsed=parseText(t), h='<span class="h">'+parsed.length+'개 시간이 만들어져요</span>';
  parsed.slice(0,5).forEach(function(b){
    var c=catOf(b.cat);
    h+='<span class="p" style="background:'+c.bg+';color:'+inkOf(c.bg)+'">'+label(b.start)+' '+esc(b.title)+(b.items.length?" +"+b.items.length:"")+'</span>';
  });
  if(parsed.length>5) h+='<span class="h" style="color:#C3B9D1">… 외 '+(parsed.length-5)+'개</span>';
  p.innerHTML=h;
}

/* 요일 복사 */
function openCopy(){
  var h='<h2>'+DAYS[UI.day]+'요일 계획을 복사</h2><p class="desc">고른 요일이 이 요일 내용으로 바뀌어요.</p><div class="wrap" id="cpDays">';
  for(var i=0;i<7;i++){ if(i===UI.day) continue;
    h+='<button class="catChip" data-act="cpDay" data-d="'+i+'" style="background:#F5F1FA;color:#9A93A6">'+DAYS[i]+'요일</button>'; }
  h+='</div><div class="btnRow"><button class="primary" data-act="doCopy">붙여넣기</button></div>';
  sheet(h);
}

/* 확인창 / 백업 */
var confirmBack=null;
function openConfirm(text,cta,act,back){
  confirmBack=back||null;
  sheet('<h2>'+text+'</h2><div class="btnRow">'+
    '<button class="secondary" data-act="confirmCancel">그만두기</button>'+
    '<button class="primary" data-act="'+act+'">'+cta+'</button></div>');
}
function openBackup(){
  var json=JSON.stringify(S);
  var h='<h2>'+(storeOK?"이 기기에 잘 저장되고 있어요":"이 브라우저에서는 저장이 막혀 있어요")+'</h2>';
  h+='<p class="desc">'+(storeOK
    ? "이 앱은 지금 보고 있는 브라우저 안에 저장돼요. 다른 기기(컴퓨터)로 옮기려면 아래 백업을 쓰세요."
    : "사생활 보호 모드이거나 저장이 꺼져 있을 수 있어요. 아래 백업 파일을 보관해 주세요.")+'</p>';
  h+='<label class="f">백업</label><textarea class="in" id="bkText" rows="4" readonly style="font-size:12px">'+esc(json)+'</textarea>';
  h+='<div style="display:flex;gap:8px;margin-top:8px">'+
     '<button class="soft" data-act="bkSelect">전체 선택</button>'+
     '<button class="soft" data-act="bkShare">파일로 내보내기</button></div>';
  h+='<p class="limit">① <b>전체 선택</b>을 누르고 ② 글상자를 길게 눌러 <b>복사</b>를 고르세요.<br>'+
     '앱 안에서는 자동 복사·공유가 막혀 있어요. HTML 파일을 받아 <b>Safari에서 열면</b> 버튼 한 번으로 됩니다.</p>';
  h+='<label class="f">백업으로 되돌리기</label><textarea class="in" id="rsText" rows="3" placeholder=\'{"cats":[...],"days":{...}}\' style="font-size:12px"></textarea>';
  h+='<button class="soft" style="width:100%;padding:11px 0;margin-top:8px" data-act="doRestore">되돌리기</button>';
  h+='<label class="f">파일에서 불러오기</label><input type="file" id="rsFile" accept=".json,.txt" class="in" style="font-size:14px">';
  h+='<button class="soft danger" style="width:100%;padding:11px 0;margin-top:14px" data-act="factoryReset">처음 상태로 되돌리기</button>';
  h+='<p class="limit">계획표와 색 설정이 모두 지워지고, 처음 시작 화면으로 돌아가요.</p>';
  sheet(h);
  document.getElementById("rsFile").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){ applyRestore(r.result); };
    r.readAsText(f);
  });
}
function applyRestore(text){
  try{
    var o=JSON.parse(text);
    if(o&&o.days){ S=o; if(!S.cats) S.cats=DEFAULT_CATS.slice(); closeModal(); render(); save(); }
    else alert("형식이 맞지 않아요");
  }catch(e){ alert("형식이 맞지 않아요"); }
}

/* ─── 클릭 처리 ──────────────────────────────────── */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el) return;
  var a=el.getAttribute("data-act");

  if(a==="dim"){ if(e.target.closest(".sheet")&&el.className!=="secondary") return; closeModal(); return; }
  if(a==="day"){ goDay(+el.getAttribute("data-d")); return; }
  if(a==="view"){
    UI.view=el.getAttribute("data-v");
    SEL.on=false; SEL.ids=[];
    render();
    if(UI.view==="week") requestAnimationFrame(centerWeekDay);
    return;
  }
  if(a==="wideSet"){
    var w=el.getAttribute("data-w")==="1";
    if(UI.wide!==w){ UI.wide=w; renderMain(); requestAnimationFrame(centerWeekDay); }
    return;
  }

  if(a==="tb"){
    var id=el.getAttribute("data-id");
    S.days[UI.day]=S.days[UI.day].map(function(b){
      if(b.id!==id) return b;
      return Object.assign({},b,{done:!b.done});
    });
    renderMain(); save(); return;
  }
  if(a==="ti"){
    var bid=el.getAttribute("data-b"), iid=el.getAttribute("data-i");
    S.days[UI.day]=S.days[UI.day].map(function(b){
      if(b.id!==bid) return b;
      var items=b.items.map(function(i){ return i.id===iid?Object.assign({},i,{done:!i.done}):i; });
      /* 세부를 다 하면 제목도 자동 완료. 이미 켜둔 제목 체크는 건드리지 않음 */
      return Object.assign({},b,{items:items,done:b.done||items.every(function(i){return i.done;})});
    });
    renderMain(); save(); return;
  }
  if(a==="edit"){
    var b=dayBlocks(UI.day).find(function(x){ return x.id===el.getAttribute("data-id"); });
    if(b) openEditor(UI.day,b); return;
  }
  if(a==="editIn"){
    var d=+el.getAttribute("data-d");
    var b2=dayBlocks(d).find(function(x){ return x.id===el.getAttribute("data-id"); });
    if(b2) openEditor(d,b2); return;
  }
  if(a==="add"){
    if(SEL.on) return;
    var st0=+el.getAttribute("data-s");
    if(CLIP){ pasteAt(UI.day,st0); return; }
    openEditor(UI.day,null,st0,+el.getAttribute("data-l")); return;
  }
  if(a==="startMake"){
    UI.skipEmpty=true; renderMain();
    toast("빈 시간을 눌러 일정을 넣어 보세요");
    return;
  }
  if(a==="startExample"){
    S.days[UI.day]=parseText(SAMPLE);
    UI.skipEmpty=false;
    render(); save();
    toast("예시를 넣었어요");
    return;
  }
  if(a==="selStart"){ SEL.on=true; SEL.ids=[]; renderMain(); return; }
  if(a==="selCancel"){ SEL.on=false; SEL.ids=[]; renderMain(); return; }
  if(a==="selToggle"){
    var sid=el.getAttribute("data-id"), k=SEL.ids.indexOf(sid);
    if(k>=0) SEL.ids.splice(k,1); else SEL.ids.push(sid);
    renderMain(); return;
  }
  if(a==="selDelete"){
    if(!SEL.ids.length){ toast("지울 블록을 골라 주세요"); return; }
    openConfirm("고른 "+SEL.ids.length+"개 블록을 지울까요?","지우기","doSelDelete"); return;
  }
  if(a==="doSelDelete"){
    S.days[UI.day]=(S.days[UI.day]||[]).filter(function(b){ return SEL.ids.indexOf(b.id)<0; });
    var n=SEL.ids.length;
    SEL.on=false; SEL.ids=[];
    closeModal(); render(); save();
    toast(n+"개 지웠어요");
    return;
  }
  if(a==="copyBlock"){
    var src=(S.days[draft.day]||[]).find(function(x){ return x.id===draft.id; });
    if(src){
      CLIP={ title:src.title, cat:src.cat, len:src.len, start:src.start,
             items:src.items.map(function(i){ return i.t; }) };
      closeModal(); render(); toast("복사됨 · "+(src.title||"제목 없음"));
    }
    return;
  }
  if(a==="clipClear"){ CLIP=null; render(); return; }
  if(a==="clipDays"){ openClipPaste(); return; }
  if(a==="clDay"){
    var on3=el.classList.toggle("selD");
    el.style.background=on3?"#C6E4F7":"#F5F1FA"; el.style.color=on3?"#3C5F8C":"#9A93A6"; return;
  }
  if(a==="doClipPaste"){
    var hh2=+document.getElementById("cpH").value, mm2=+document.getElementById("cpM").value;
    var st2=(hh2*60+mm2)/UNIT, tg2=[];
    M.querySelectorAll("#clDays .selD").forEach(function(x){ tg2.push(+x.getAttribute("data-d")); });
    if(!tg2.length) return alert("요일을 골라 주세요");
    var okCnt=0;
    tg2.forEach(function(d2){
      (S.days[d2]=S.days[d2]||[]).push({
        id:uid(), start:st2, len:Math.max(1,Math.min(CLIP.len,N-st2)),
        title:CLIP.title, cat:CLIP.cat,
        items:CLIP.items.map(function(t){ return {id:uid(),t:t,done:false}; }), done:false });
      okCnt++;
    });
    closeModal(); render(); save();
    toast(okCnt+"곳에 붙였어요");
    return;
  }

  if(a==="pickCat"){
    draft.cat=el.getAttribute("data-id");
    M.querySelectorAll('#edCats [data-act="pickCat"]').forEach(function(x){
      var c=catOf(x.getAttribute("data-id"));
      var on=x.getAttribute("data-id")===draft.cat;
      x.className="catChip"+(on?" sel":"");
      x.style.borderColor=on?inkOf(c.bg):"transparent";
    });
    return;
  }
  if(a==="preset"){
    var v=el.getAttribute("data-l");
    draft.len = v==="fill" ? maxLenFor() : Math.min(N-draft.start, +v);
    if(draft.len<1) draft.len=1;
    updateLen(); return;
  }
  if(a==="lenMinus"){ draft.len=Math.max(1,draft.len-1); updateLen(); return; }
  if(a==="lenPlus"){ draft.len=Math.min(N-draft.start,draft.len+1); updateLen(); return; }
  if(a==="saveBlock"){ saveBlock(); return; }
  if(a==="del"){
    var t0=document.getElementById("edTitle");
    if(t0) draft.title=t0.value;                       /* 되돌아왔을 때 쓴 내용 유지 */
    var i0=document.getElementById("edItems");
    if(i0) draft.itemText=i0.value;
    openConfirm("'"+(draft.title||"제목 없음")+"' 블록을 지울까요?","지우기","doDel","editor"); return;
  }
  if(a==="close"){ closeModal(); return; }
  if(a==="confirmCancel"){
    if(confirmBack==="editor"){ confirmBack=null; renderEditorSheet(); }
    else closeModal();
    return;
  }
  if(a==="doDel"){
    S.days[draft.day]=S.days[draft.day].filter(function(b){ return b.id!==draft.id; });
    closeModal(); render(); save(); toast("지웠어요"); return;
  }

  if(a==="cats"){ openCats(); return; }
  if(a==="pal"){ el.parentNode.parentNode.querySelector(".pal").classList.toggle("open"); return; }
  if(a==="setPal"){
    var row=el.closest(".catRow"), col=el.getAttribute("data-c");
    row.querySelector(".cBg").value=col;
    row.querySelector(".swatch").style.background=col;
    row.querySelector(".swatch").style.borderColor=lineOf(col);
    row.style.background=col+"55"; row.style.borderColor=lineOf(col);
    row.querySelector(".pal").classList.remove("open"); return;
  }
  if(a==="delCat"){ el.closest(".catRow").remove(); return; }
  if(a==="factoryReset"){
    openConfirm("모든 계획표와 색 설정을 지우고 처음 상태로 돌아갈까요?<br><span style=\"font-size:14px;color:#B0A6BD\">되돌릴 수 없어요. 먼저 백업해 두세요</span>","처음 상태로","doFactoryReset");
    return;
  }
  if(a==="doFactoryReset"){
    S={ cats:DEFAULT_CATS.map(function(c){ return Object.assign({},c); }), days:{} };
    for(var fd=0;fd<7;fd++) S.days[fd]=[];
    UI.day=todayIdx(); UI.view="day"; SEL.on=false; SEL.ids=[]; UI.skipEmpty=false;
    closeModal(); render(); save();
    toast("처음 상태로 되돌렸어요");
    return;
  }
  if(a==="resetCats"){
    openConfirm("색과 인식 단어를 처음 설정으로 되돌릴까요?<br><span style=\"font-size:14px;color:#B0A6BD\">계획표 내용은 그대로 남아요</span>","되돌리기","doResetCats");
    return;
  }
  if(a==="doResetCats"){
    S.cats=DEFAULT_CATS.map(function(c){ return Object.assign({},c); });
    closeModal(); render(); save();
    toast("기본값으로 되돌렸어요");
    return;
  }
  if(a==="addCat"){
    var used=[]; M.querySelectorAll(".cBg").forEach(function(x){ used.push(x.value); });
    var free=PALETTE.find(function(p){ return used.indexOf(p)<0; })||PALETTE[0];
    var wrap=document.createElement("div");
    wrap.innerHTML=catRowHTML({id:uid(),name:"새 항목",words:"",bg:free});
    document.getElementById("catRows").appendChild(wrap.firstChild); fitWordBoxes(); return;
  }
  if(a==="saveCats"){ saveCats(); return; }

  if(a==="import"){ openImport(); return; }
  if(a==="imDay"){
    var on=el.classList.toggle("selD");
    el.style.background=on?"#C6E4F7":"#F5F1FA"; el.style.color=on?"#3C5F8C":"#9A93A6"; return;
  }
  if(a==="doImport"){
    var text=document.getElementById("imText").value.trim();
    if(!text) return alert("붙여넣은 글이 없어요");
    var parsed=parseText(text), targets=[];
    M.querySelectorAll("#imDays .selD").forEach(function(x){ targets.push(+x.getAttribute("data-d")); });
    if(!targets.length) return alert("요일을 골라 주세요");
    targets.forEach(function(t){
      S.days[t]=parsed.map(function(b){
        return Object.assign({},b,{id:uid(),items:b.items.map(function(i){ return Object.assign({},i,{id:uid()}); })});
      });
    });
    UI.day=targets[0]; UI.view="day"; closeModal(); render(); save(); return;
  }

  if(a==="copyDay"){ openCopy(); return; }
  if(a==="cpDay"){
    var on2=el.classList.toggle("selD");
    el.style.background=on2?"#C6E4F7":"#F5F1FA"; el.style.color=on2?"#3C5F8C":"#9A93A6"; return;
  }
  if(a==="doCopy"){
    var tg=[]; M.querySelectorAll("#cpDays .selD").forEach(function(x){ tg.push(+x.getAttribute("data-d")); });
    if(!tg.length) return alert("요일을 골라 주세요");
    tg.forEach(function(t){
      S.days[t]=dayBlocks(UI.day).map(function(b){
        return Object.assign({},b,{id:uid(),done:false,
          items:b.items.map(function(i){ return Object.assign({},i,{id:uid(),done:false}); })});
      });
    });
    closeModal(); render(); save(); return;
  }

  if(a==="clearChecks"){ openConfirm(DAYS[UI.day]+"요일을 처음부터 다시 시작할까요?","다시 시작","doClear"); return; }
  if(a==="clearDay"){
    openConfirm(DAYS[UI.day]+"요일 계획을 모두 지울까요? (블록 "+dayBlocks(UI.day).length+"개)","전체 지우기","doClearDay");
    return;
  }
  if(a==="doClearDay"){
    S.days[UI.day]=[];
    closeModal(); render(); save();
    toast(DAYS[UI.day]+"요일을 비웠어요");
    return;
  }
  if(a==="doClear"){
    S.days[UI.day]=dayBlocks(UI.day).map(function(b){
      return Object.assign({},b,{done:false,items:b.items.map(function(i){ return Object.assign({},i,{done:false}); })});
    });
    closeModal(); render(); save(); return;
  }

  if(a==="backup"){ openBackup(); return; }
  if(a==="bkSelect"){
    var ta=document.getElementById("bkText");
    ta.readOnly=false;
    ta.focus();
    try{ ta.setSelectionRange(0,ta.value.length); }catch(err){}
    toast("글이 선택됐어요 · 길게 눌러 '복사'를 누르세요");
    return;
  }
  if(a==="bkShare"){
    var json=JSON.stringify(S), dt=new Date();
    var nm="계획표-"+dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+".json";
    /* ① 파일 공유 (아이폰에서 '파일에 저장' 가능) */
    try{
      if(navigator.canShare && window.File){
        var f=new File([json],nm,{type:"application/json"});
        if(navigator.canShare({files:[f]})){
          navigator.share({files:[f],title:nm}).catch(function(){});
          return;
        }
      }
    }catch(e1){}
    /* ② 글로 공유 (메모·메일로 보내기) */
    try{
      if(navigator.share){ navigator.share({title:nm,text:json}).catch(function(){}); return; }
    }catch(e2){}
    /* ③ 파일 내려받기 (컴퓨터 브라우저) */
    try{
      var blob=new Blob([json],{type:"application/json"});
      var url=URL.createObjectURL(blob), link=document.createElement("a");
      link.href=url; link.download=nm; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },1500);
      toast("내려받기를 시작했어요");
      return;
    }catch(e3){}
    /* ④ 새 창에 글로 열기 */
    try{
      var w=window.open("","_blank");
      if(w){ w.document.write("<pre style='white-space:pre-wrap;word-break:break-all'>"+esc(json)+"</pre>"); w.document.close(); return; }
    }catch(e4){}
    toast("이 화면에서는 파일 내보내기가 막혀요 · '전체 선택'으로 복사해 주세요");
    return;
  }
  if(a==="doRestore"){ applyRestore(document.getElementById("rsText").value); return; }
});

document.addEventListener("change",function(e){
  if(e.target.id==="edH"||e.target.id==="edM") syncStart();
  if(e.target.id==="edEH"||e.target.id==="edEM") setEndFromSelect();
});
document.addEventListener("input",function(e){
  if(e.target.classList&&e.target.classList.contains("cWords")){
    e.target.style.height="auto";
    e.target.style.height=(e.target.scrollHeight+2)+"px";
  }
});
document.getElementById("saveTag").setAttribute("data-act","backup");

/* 좌우 슬라이드 */
var tx=0,ty=0,tInCluster=false;
document.addEventListener("touchstart",function(e){
  tx=e.touches[0].clientX; ty=e.touches[0].clientY;
  tInCluster = !!(e.target.closest && e.target.closest(".clusterRow"));
},{passive:true});
document.addEventListener("touchend",function(e){
  if(UI.view!=="day"||M.innerHTML||tInCluster||SEL.on) return;
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6){
    goDay(UI.day+(dx<0?1:6));   /* 일 → 월, 월 → 일 로 이어짐 */
  }
},{passive:true});

/* 시작 */
